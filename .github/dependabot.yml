# Keep the digest-pinned base images up to date automatically.
# Dependabot opens a PR whenever a new digest is published for the pinned tags
# in each Dockerfile; the docker-publish workflow then rebuilds and republishes.
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/relay"
      - "/ui"
      - "/nginx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Stay on the Python 3.12 line: keep receiving security/patch refreshes
      # (digest bumps of the 3.12-slim-bookworm tag) but NOT feature jumps
      # (3.13, 3.14, ...). Python 3.12 gets upstream security fixes until
      # ~Oct 2028; minor/major upgrades are done deliberately and tested by hand.
      # nginx is intentionally NOT ignored: its minor bumps carry security fixes
      # (new mainline/stable lines), so we want those PRs.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

name: Windows build

# Builds the native-Windows package: smtp-relay.exe (PyInstaller) wrapped into
# smtp-relay-setup.exe (Inno Setup). This runs ONLY on a Windows runner — the
# Docker images are built by separate Linux workflows and are unaffected.

on:
  # Manual trigger (available once this file is on the default branch).
  workflow_dispatch:
  # Build automatically on the Windows feature branches. This does NOT touch
  # Docker: docker-publish.yml only runs on `main` and on `v*` tags, so pushing
  # to a claude/** branch never republishes the Docker images. The installer is
  # produced as a downloadable artifact (no Release is created).
  push:
    branches:
      - 'claude/**'
    paths:
      - 'windows/**'
      - 'common/**'
      - 'relay/**'
      - 'ui/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

# upload-artifact has no Node 24 release yet (it still ships on Node 20). This
# opt-in, documented by GitHub, forces all JavaScript actions to run on Node 24
# so the deprecation warning goes away and the workflow is future-proof.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    env:
      WINSW_VERSION: v2.12.0
      WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install -r windows/requirements.txt

      - name: Build executable (PyInstaller)
        run: pyinstaller --noconfirm windows/smtp-relay.spec

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Package version: $v"

      - name: Stage installer payload
        shell: pwsh
        run: |
          $stage = "staging"
          New-Item -ItemType Directory -Force -Path "$stage\app" | Out-Null
          # PyInstaller onedir output -> app\
          Copy-Item -Recurse -Force "dist\smtp-relay\*" "$stage\app\"
          # WinSW: one renamed copy per service (exe basename must match the XML).
          # Download with retries and verify it is a real PE/exe (GitHub can
          # transiently return an HTML error page, which would otherwise be
          # saved as a bogus .exe and break the install).
          $winsw = "$stage\smtp-relay-relay.exe"
          $ok = $false
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-WebRequest -Uri $env:WINSW_URL -OutFile $winsw -UseBasicParsing -MaximumRedirection 5
              $bytes = [IO.File]::ReadAllBytes($winsw)
              if ($bytes.Length -gt 100000 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) { $ok = $true; break }
              Write-Host "Attempt $i: downloaded file is not a valid exe (size $($bytes.Length)); retrying..."
            } catch {
              Write-Host "Attempt $i failed: $($_.Exception.Message); retrying..."
            }
            Start-Sleep -Seconds ([Math]::Pow(2, $i))
          }
          if (-not $ok) { throw "Could not download a valid WinSW exe from $env:WINSW_URL" }
          Copy-Item $winsw "$stage\smtp-relay-ui.exe"
          # Service definitions, scripts, config template, docs.
          Copy-Item "windows\smtp-relay-relay.xml" "$stage\"
          Copy-Item "windows\smtp-relay-ui.xml"    "$stage\"
          Copy-Item "windows\install.ps1"          "$stage\"
          Copy-Item "windows\uninstall.ps1"        "$stage\"
          Copy-Item "windows\manage.ps1"           "$stage\"
          Copy-Item "windows\panel.url"            "$stage\"
          Copy-Item "windows\start-tray.vbs"       "$stage\"
          Copy-Item "windows\config.env.template"  "$stage\"
          New-Item -ItemType Directory -Force -Path "$stage\icons" | Out-Null
          Copy-Item "windows\icons\*.ico"        "$stage\icons\"
          Copy-Item "README-windows.md"            "$stage\"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $stageAbs = (Resolve-Path "staging").Path
          # Absolute output dir: Inno Setup resolves a relative OutputDir against
          # the .iss location (windows\), so pass an absolute path at the repo root.
          $outAbs = Join-Path (Get-Location).Path "output"
          New-Item -ItemType Directory -Force -Path $outAbs | Out-Null
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" "/DStageDir=$stageAbs" "/DOutDir=$outAbs" "windows\smtp-relay.iss"

      # --- Optional code signing (disabled until a certificate is provided) ---
      # Set the repository secrets CODE_SIGN_PFX_BASE64 and CODE_SIGN_PASSWORD
      # to enable. Until then this step is skipped and the installer ships
      # unsigned (Windows SmartScreen shows an "unknown publisher" prompt).
      - name: Sign installer
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1).FullName
          & $signtool sign /f cert.pfx /p $env:CODE_SIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "output\smtp-relay-setup.exe"
          Remove-Item cert.pfx

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: smtp-relay-setup-${{ steps.version.outputs.version }}
          path: output/smtp-relay-setup.exe
